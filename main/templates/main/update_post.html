{% extends "main/base.html" %}

{% block title %}Edit Post | Blogger{% endblock %}

{% block content %}
    <h1 class="page-title">Edit Post</h1>

    <form method="POST" action="{% url 'main:update_post_view' post.id %}" class="post-form" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="2048" value="{{ post.title }}" required>

        <label for="author">Author</label>
        <input type="text" id="author" name="author" maxlength="100" value="{{ post.author }}" required>

        <label for="content">Content</label>
        <textarea id="content" name="content" rows="8" required>{{ post.content }}</textarea>

        {% if post.image %}
            <p>Current image:</p>
            <img src="{{ post.image.url }}" alt="{{ post.title }}" class="detail-image">
        {% endif %}

        <label for="image">Change image (optional)</label>
        <input type="file" id="image" name="image" accept="image/*">

        <label class="checkbox">
            <input type="checkbox" name="is_published" {% if post.is_published %}checked{% endif %}>
            Published
        </label>

        <button type="submit" class="btn">Save Changes</button>
    </form>
{% endblock %}
