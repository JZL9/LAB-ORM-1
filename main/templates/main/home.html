{% extends "main/base.html" %}

{% block title %}Home | Blogger{% endblock %}

{% block content %}
    <h1 class="page-title">Latest Posts</h1>

    <div class="posts-grid">
        {% for post in posts %}
            {% include "main/partials/post_tile.html" %}
        {% empty %}
            <p class="empty">No posts yet. <a href="{% url 'main:add_post_view' %}">Write the first one!</a></p>
        {% endfor %}
    </div>

    <div class="view-all">
        <a href="{% url 'main:all_posts_view' %}" class="btn">View all posts →</a>
    </div>
{% endblock %}
